<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Política de segurança: diz ao navegador de onde a página pode carregar
       código e com quem pode conversar. Se alguém conseguir injetar um script
       na página, ele não roda e não consegue mandar dados para outro servidor.
       Ao adicionar fontes ou imagens externas no Passo 9, liberar aqui. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://cdn.jsdelivr.net;
    connect-src 'self' https://wqwldmcacnpsotnrecur.supabase.co;
    img-src 'self' data:;
    style-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self'">

  <title>Assinaturas</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <main id="app">
    <h1>Assinaturas</h1>

    <!-- Mensagens gerais, como "enviamos um link para o seu e-mail" -->
    <p id="aviso" role="status" hidden></p>

    <!-- Visível até o app descobrir se existe sessão, para nunca ficar em branco -->
    <p id="tela-carregando">Carregando...</p>

    <!-- Todos os formulários usam method="post". O JavaScript cuida do envio,
         mas, se ele falhar, isso impede que e-mail e senha apareçam no
         endereço da página e fiquem gravados no histórico do navegador. -->

    <section id="tela-entrar" hidden>
      <h2>Entrar</h2>
      <form id="form-entrar" method="post">
        <label>E-mail
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>Senha
          <input type="password" name="senha" autocomplete="current-password" required>
        </label>
        <p class="erro" role="alert"></p>
        <button type="submit">Entrar</button>
      </form>
      <button type="button" data-ir-para="criarConta">Não tenho conta</button>
      <button type="button" data-ir-para="pedirNovaSenha">Esqueci a senha</button>
    </section>

    <section id="tela-criar-conta" hidden>
      <h2>Criar conta</h2>
      <form id="form-criar-conta" method="post">
        <label>E-mail
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>Senha (mínimo de 8 caracteres)
          <input type="password" name="senha" autocomplete="new-password" minlength="8" required>
        </label>
        <p class="erro" role="alert"></p>
        <button type="submit">Criar conta</button>
      </form>
      <button type="button" data-ir-para="entrar">Já tenho conta</button>
    </section>

    <section id="tela-pedir-nova-senha" hidden>
      <h2>Esqueci a senha</h2>
      <form id="form-pedir-nova-senha" method="post">
        <label>E-mail da conta
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <p class="erro" role="alert"></p>
        <button type="submit">Enviar link para criar nova senha</button>
      </form>
      <button type="button" data-ir-para="entrar">Voltar</button>
    </section>

    <section id="tela-nova-senha" hidden>
      <h2>Criar nova senha</h2>
      <form id="form-nova-senha" method="post">
        <label>Nova senha (mínimo de 8 caracteres)
          <input type="password" name="senha" autocomplete="new-password" minlength="8" required>
        </label>
        <p class="erro" role="alert"></p>
        <button type="submit">Salvar nova senha</button>
      </form>
    </section>

    <section id="tela-inicio" hidden>
      <p>
        Você entrou como <strong id="email-usuario"></strong>.
        <button type="button" id="botao-sair">Sair</button>
      </p>

      <h2>Nova assinatura</h2>
      <form id="form-nova-assinatura" method="post">
        <!-- pattern exige ao menos um caractere que não seja espaço -->
        <label>Nome
          <input name="nome" required maxlength="100" pattern=".*\S.*" placeholder="Netflix">
        </label>
        <label>Valor cobrado por ciclo (R$)
          <input name="valor" type="number" step="0.01" min="0.01" inputmode="decimal" required>
        </label>
        <label>Ciclo
          <select name="ciclo" required>
            <option value="mensal">Mensal</option>
            <option value="trimestral">Trimestral</option>
            <option value="anual">Anual</option>
          </select>
        </label>
        <label>Próxima cobrança
          <input name="proxima_cobranca" type="date" required>
        </label>
        <label>Categoria (opcional)
          <input name="categoria" maxlength="50" placeholder="streaming">
        </label>
        <p class="erro" role="alert"></p>
        <button type="submit">Salvar</button>
      </form>

      <!-- Listagem crua do Passo 5. A tela inicial de verdade vem no Passo 6. -->
      <h2>Minhas assinaturas</h2>
      <p id="estado-lista"></p>
      <ul id="lista-assinaturas"></ul>
    </section>
  </main>

  <!-- Biblioteca do Supabase, versão fixada. O "integrity" é a impressão digital
       do arquivo: se o CDN entregar qualquer coisa diferente do pacote oficial,
       o navegador se recusa a executar. Ao trocar a versão, recalcular o hash. -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"
    integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP"
    crossorigin="anonymous"></script>

  <!-- type="module" permite usar import/export entre os arquivos de js/ -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
